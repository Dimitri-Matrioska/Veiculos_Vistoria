<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste API Placas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }

        #btnToken {
            background: #264FEC;
            color: white;
        }

        #btnPlaca {
            background: #222;
            color: white;
        }

        #status {
            margin-top: 25px;
            padding: 15px;
            background: #f3f3f3;
            border-radius: 6px;
            white-space: pre-wrap;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background: #eef5ff;
            border-radius: 6px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h1>Teste API Placas</h1>

    <label for="email">E-mail</label>
    <input
        type="email"
        id="email"
        placeholder="Seu e-mail da API"
    >

    <label for="senha">Senha</label>
    <input
        type="password"
        id="senha"
        placeholder="Sua senha da API"
    >

    <button id="btnToken" onclick="gerarToken()">
        Gerar Token
    </button>

    <label for="placa">Placa</label>
    <input
        type="text"
        id="placa"
        placeholder="AAA0000"
        maxlength="7"
        style="text-transform: uppercase;"
    >

    <button id="btnPlaca" onclick="consultarPlaca()">
        Consultar Placa
    </button>

    <div id="status">
        Status: aguardando...
    </div>

    <div id="resultado">
        Resultado aparecerá aqui.
    </div>


<script>

    // =========================================================
    // CONFIGURAÇÃO
    // =========================================================

    const URL_TOKEN =
        "https://placas.app.br/api/v1/authenticate";

    const URL_PLACA =
        "https://placas.app.br/api/v1/placas/numero";


    // Token ficará somente durante esta sessão
    let token = null;


    // =========================================================
    // FUNÇÃO: GERAR TOKEN
    // =========================================================

    async function gerarToken() {

        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value;

        const status = document.getElementById("status");
        const resultado = document.getElementById("resultado");

        if (!email || !senha) {

            status.textContent =
                "ERRO: informe o e-mail e a senha.";

            return;
        }

        status.textContent =
            "Gerando token...";

        resultado.textContent =
            "";


        try {

            const resposta = await fetch(URL_TOKEN, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: senha
                })

            });


            const texto = await resposta.text();


            console.log("Resposta autenticação:", texto);


            if (!resposta.ok) {

                status.textContent =
                    "ERRO HTTP " + resposta.status;

                resultado.textContent =
                    texto;

                return;
            }


            let dados;

            try {

                dados = JSON.parse(texto);

            } catch {

                status.textContent =
                    "A API respondeu, mas não retornou JSON válido.";

                resultado.textContent =
                    texto;

                return;
            }


            console.log("Dados autenticação:", dados);


            // Tentamos encontrar o token nas propriedades mais comuns

            token =
                dados.token ||
                dados.access_token ||
                dados.accessToken ||
                dados.jwt;


            if (!token) {

                status.textContent =
                    "A API respondeu, mas não encontrei o token.";

                resultado.textContent =
                    JSON.stringify(dados, null, 2);

                return;
            }


            status.textContent =
                "TOKEN GERADO COM SUCESSO.";

            resultado.textContent =
                "Token recebido.\n\n" +
                "Agora podemos consultar a placa.";


            console.log("Token recebido com sucesso.");


        } catch (erro) {

            console.error(erro);

            status.textContent =
                "ERRO AO GERAR TOKEN:";

            resultado.textContent =
                erro.toString() +
                "\n\n" +
                "Se aparecer 'Failed to fetch' ou erro de CORS, " +
                "o navegador está bloqueando a comunicação com a API.";

        }

    }


    // =========================================================
    // FUNÇÃO: CONSULTAR PLACA
    // =========================================================

    async function consultarPlaca() {

        const placa =
            document.getElementById("placa").value
            .trim()
            .toUpperCase();

        const status =
            document.getElementById("status");

        const resultado =
            document.getElementById("resultado");


        if (!token) {

            status.textContent =
                "ERRO: primeiro devemos gerar o token.";

            resultado.textContent =
                "";

            return;
        }


        if (!placa) {

            status.textContent =
                "ERRO: informe a placa.";

            return;
        }


        status.textContent =
            "Consultando placa " + placa + "...";

        resultado.textContent =
            "";


        try {

            const resposta = await fetch(URL_PLACA, {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + token

                },

                body: JSON.stringify({

                    placa: placa

                })

            });


            const texto =
                await resposta.text();


            console.log(
                "Resposta consulta:",
                texto
            );


            if (!resposta.ok) {

                status.textContent =
                    "ERRO HTTP " + resposta.status;

                resultado.textContent =
                    texto;

                return;
            }


            let dados;

            try {

                dados =
                    JSON.parse(texto);

            } catch {

                status.textContent =
                    "A API respondeu, mas não retornou JSON válido.";

                resultado.textContent =
                    texto;

                return;
            }


            status.textContent =
                "CONSULTA REALIZADA COM SUCESSO.";

            resultado.textContent =
                JSON.stringify(
                    dados,
                    null,
                    2
                );


            console.log(
                "Dados completos da placa:",
                dados
            );


        } catch (erro) {

            console.error(erro);

            status.textContent =
                "ERRO AO CONSULTAR PLACA:";

            resultado.textContent =
                erro.toString() +
                "\n\n" +
                "Se aparecer 'Failed to fetch' ou CORS, " +
                "o navegador está bloqueando a API.";

        }

    }

</script>

</body>
</html>
