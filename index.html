<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist de Veículo - Teste 1 Foto</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f7f6; padding: 16px; color: #333; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 24px; color: #1a202c; }
        label { display: block; margin: 16px 0 8px; font-weight: 600; font-size: 0.95rem; }
        input, select { width: 100%; padding: 16px; border: 1px solid #cbd5e0; border-radius: 10px; font-size: 16px; margin-bottom: 8px; background: #fff; }
        .photo-box { background: #edf2f7; border: 2px dashed #cbd5e0; padding: 20px; text-align: center; border-radius: 10px; color: #718096; font-size: 0.95rem; font-weight: 600; position: relative; margin: 20px 0; }
        .photo-box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        button[type="submit"] { width: 100%; padding: 18px; background: #2b6cb0; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; margin-top: 16px; cursor: pointer; }
        button:disabled { background: #a0aec0; }
        #status-msg { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; text-align: center; font-weight: 600; }
        .success { background: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .error { background: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Entrada de Veículo 2 (Teste 1 Foto)</h1>
        <form id="vehicleForm">
            <label>Nome do Motorista</label>
            <input type="text" id="motorista" required placeholder="Nome completo">
            
            <label>CPF</label>
            <input type="tel" id="cpf" required placeholder="000.000.000-00">
            
            <label>Placa</label>
            <input type="text" id="placa" required placeholder="ABC1234" style="text-transform: uppercase;">
            
            <label>Modelo</label>
            <input type="text" id="modelo" required placeholder="Ex: Fiat Strada">
            
            <label>Cor</label>
            <select id="cor" required>
                <option value="">Selecione uma cor</option>
                <option>Branco</option><option>Prata</option><option>Preto</option><option>Cinza</option><option>Vermelho</option>
            </select>

            <label>Foto de Registro (Dianteira)</label>
            <div class="photo-box" id="label-dianteira">
                <span id="photo-status">📸 Tirar/Selecionar Foto</span>
                <input type="file" accept="image/*" capture="environment" id="fotoDianteira" required>
            </div>

            <button type="submit" id="btnSubmit">Registrar Entrada</button>
        </form>

        <div id="status-msg"></div>
    </div>

    <script>
        // COLE SUA URL DA IMPLANTAÇÃO DO GOOGLE APPS SCRIPT ABAIXO
        const API_URL = "https://script.google.com/macros/s/AKfycbyqvnIpHxNR2njqrkKvyT5qVXyrYncnRrNzPUCJ_3cANn7PO8h93qIPY-gxMAWpK9-vDA/exec";

        document.getElementById('fotoDianteira').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                const size = (e.target.files[0].size / (1024*1024)).toFixed(2);
                document.getElementById('photo-status').innerText = `✓ Foto Selecionada (${size} MB)`;
                document.getElementById('label-dianteira').style.background = "#c6f6d5";
                document.getElementById('label-dianteira').style.borderColor = "#38a169";
            }
        });

        const fileToBase64 = file => new Promise((resolve, reject) => {
            if (!file) return resolve("");
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        function showMessage(text, isError = false) {
            const msgDiv = document.getElementById('status-msg');
            msgDiv.style.display = 'block';
            msgDiv.className = isError ? 'error' : 'success';
            msgDiv.innerText = text;
        }

        document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "Lendo foto...";

            try {
                const fotoFile = document.getElementById('fotoDianteira').files[0];
                const fotoBase64 = await fileToBase64(fotoFile);

                btn.innerText = "Enviando ao Google Drive...";

                const payload = {
                    motorista: document.getElementById('motorista').value,
                    cpf: document.getElementById('cpf').value,
                    placa: document.getElementById('placa').value.toUpperCase(),
                    modelo: document.getElementById('modelo').value,
                    cor: document.getElementById('cor').value,
                    fotoDianteira: fotoBase64
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === "success") {
                    showMessage("✓ Sucesso! Registro e foto salvos no Drive.");
                    document.getElementById('vehicleForm').reset();
                    document.getElementById('photo-status').innerText = "📸 Tirar/Selecionar Foto";
                    document.getElementById('label-dianteira').style.background = "#edf2f7";
                    document.getElementById('label-dianteira').style.borderColor = "#cbd5e0";
                } else {
                    showMessage("Erro no servidor Google: " + (result.message || "Erro desconhecido"), true);
                }

            } catch (err) {
                console.error(err);
                showMessage("Erro de envio: " + err.message, true);
            } finally {
                btn.disabled = false;
                btn.innerText = "Registrar Entrada";
            }
        });
    </script>
</body>
</html>
