<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vistoria de Veículos</title>

    <style>
        :root {
            --azul: #011E38;
            --bege: #F5F1EB;
            --branco: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--branco);
            font-family: Arial, Helvetica, sans-serif;
            color: var(--azul);
        }

        /* =========================
           TELA DE CARREGAMENTO
           ========================= */

        #loading {
            position: fixed;
            inset: 0;
            background: var(--branco);

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 9999;

            transition:
                opacity 0.7s ease,
                visibility 0.7s ease;
        }

        #loading img {
            width: min(75vw, 320px);
            height: auto;
        }

        #loading.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* =========================
           CONTEÚDO PRINCIPAL
           ========================= */

        #app {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;

            opacity: 0;
            transform: translateY(15px);

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }

        #app.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .container {
            width: 100%;
            max-width: 400px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================
           LOGO / TÍTULO
           ========================= */

        .titulo {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;

            margin-bottom: 8px;
        }

        .subtitulo {
            font-size: 14px;
            text-align: center;

            opacity: 0.7;

            margin-bottom: 35px;
        }

        /* =========================
           LOGIN
           ========================= */

        .login-box {
            width: 100%;

            background: var(--bege);

            border-radius: 18px;

            padding: 28px 22px;

            box-shadow:
                0 8px 25px rgba(1, 30, 56, 0.08);
        }

        .login-title {
            font-size: 20px;
            font-weight: 700;

            margin-bottom: 22px;
        }

        .campo {
            margin-bottom: 16px;
        }

        .campo label {
            display: block;

            font-size: 13px;
            font-weight: 600;

            margin-bottom: 7px;
        }

        .campo input {
            width: 100%;

            height: 48px;

            border: 1.5px solid rgba(1, 30, 56, 0.25);
            border-radius: 10px;

            padding: 0 14px;

            font-size: 16px;
            color: var(--azul);

            background: var(--branco);

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .campo input:focus {
            border-color: var(--azul);

            box-shadow:
                0 0 0 3px rgba(1, 30, 56, 0.08);
        }

        .botao-login {
            width: 100%;
            height: 50px;

            margin-top: 8px;

            border: none;
            border-radius: 10px;

            background: var(--azul);
            color: var(--branco);

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .botao-login:active {
            transform: scale(0.98);
        }

        .botao-login:hover {
            opacity: 0.92;
        }

        .esqueci {
            display: block;

            margin-top: 18px;

            text-align: center;

            color: var(--azul);

            font-size: 13px;
            text-decoration: none;

            opacity: 0.75;
        }

        /* Mensagem de Erro Integrada ao Estilo */
        #msg-erro {
            color: #d9534f;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* =========================
           DESENVOLVEDOR
           ========================= */

        .desenvolvedor {
            margin-top: 45px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .desenvolvedor span {
            font-size: 11px;

            letter-spacing: 1px;

            text-transform: uppercase;

            opacity: 0.55;

            margin-bottom: 10px;
        }

        .desenvolvedor img {
            width: 145px;
            height: auto;
        }

        /* =========================
           RESPONSIVIDADE
           ========================= */

        @media (max-height: 700px) {

            #app {
                padding-top: 20px;
                padding-bottom: 20px;
            }

            .subtitulo {
                margin-bottom: 22px;
            }

            .desenvolvedor {
                margin-top: 25px;
            }
        }

        @media (min-width: 600px) {

            #app {
                padding: 40px;
            }

            .container {
                max-width: 390px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         TELA DE CARREGAMENTO
         ========================= -->

    <div id="loading">

        <img
            src="Imagens_Logos/Logo_animada2.gif"
            alt="Carregando"
        >

    </div>


    <!-- =========================
         APLICAÇÃO
         ========================= -->

    <main id="app">

        <div class="container">

            <h1 class="titulo">
                Vistoria de Veículos
            </h1>

            <p class="subtitulo">
                Sistema de controle e inspeção
            </p>


            <!-- LOGIN -->

            <section class="login-box">

                <h2 class="login-title">
                    Acessar sistema
                </h2>

                <form id="loginForm">

                    <div class="campo">

                        <label for="usuario">
                            Usuário ou CPF
                        </label>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Digite seu usuário ou CPF"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="campo" id="campo-senha" style="display: none;">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                        >

                    </div>


                    <button
                        type="submit"
                        class="botao-login"
                        id="btnSubmit"
                    >
                        Entrar
                    </button>

                    <div id="msg-erro"></div>

                </form>


                <a
                    href="#"
                    class="esqueci"
                    onclick="alert('Entre em contato com o administrador do sistema.'); return false;"
                >
                    Esqueci minha senha
                </a>

            </section>


            <!-- DESENVOLVEDOR -->

            <div class="desenvolvedor">

                <span>
                    Desenvolvido por
                </span>

                <img
                    src="Imagens_Logos/logo_MATRIOSKA.png"
                    alt="MATRIOSKA Desenvolvimento e Soluções em Planejamento"
                >

            </div>

        </div>

    </main>


   <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzjyYCR__0C0RLLkiTEwQ0SV_HbNJo2bWA40ATiwTutGWeEcFmSkfgf1WkOsFA6BYin5g/exec";
  
    
    const TEMPO_SPLASH = 1200;

    window.addEventListener("load", function () {
        setTimeout(function () {
            const loading = document.getElementById("loading");
            const app = document.getElementById("app");

            loading.classList.add("hidden");

            setTimeout(function () {
                app.classList.add("visible");
            }, 250);

        }, TEMPO_SPLASH);
    });

    const inputUsuario = document.getElementById("usuario");
    const campoSenha = document.getElementById("campo-senha");
    const inputSenha = document.getElementById("senha");
    const msgErro = document.getElementById("msg-erro");
    const btnSubmit = document.getElementById("btnSubmit");

    // Monitora a digitação no campo de usuário/CPF
    inputUsuario.addEventListener("input", async function () {
        const valor = this.value.trim();

        // Limpa mensagens anteriores ao redefinir campo
        msgErro.style.display = "none";

        // Se o valor contiver letras (ex: nome), exibe o campo de senha imediatamente
        if (isNaN(valor) && valor.length > 2) {
            exibirCampoSenha(true);
            return;
        }

        // Se for um CPF completo (11 dígitos)
        if (valor.length === 11 && !isNaN(valor)) {
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Verificando...";

            try {
                // Consulta prévia do perfil
                const response = await fetch(`${API_URL}?action=login&identifier=${encodeURIComponent(valor)}&password=`);
                const result = await response.json();

                if (result.status === "error" && result.message === "Senha incorreta.") {
                    // Significa que o usuário foi achado e EXIGE senha (ADMIN/MASTER)
                    exibirCampoSenha(true);
                    inputSenha.focus();
                } else if (result.status === "success") {
                    // É Vistoriador e não exige senha -> Executa login automático direto!
                    efetuarRedirecionamento(result.user);
                } else {
                    exibirCampoSenha(false);
                }
            } catch (err) {
                console.error("Erro na consulta do perfil:", err);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Entrar";
            }
        } else if (valor.length < 11 && !isNaN(valor)) {
            exibirCampoSenha(false);
        }
    });

    // Submissão do Formulário
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const usuarioInput = inputUsuario.value.trim();
        const senhaInput = inputSenha.value.trim();

        msgErro.style.display = "none";
        btnSubmit.disabled = true;
        btnSubmit.innerText = "Acessando...";

        try {
            const response = await fetch(`${API_URL}?action=login&identifier=${encodeURIComponent(usuarioInput)}&password=${encodeURIComponent(senhaInput)}`);
            const result = await response.json();

            if (result.status === "success" && result.user) {
                efetuarRedirecionamento(result.user);
            } else {
                if (result.message && result.message.includes("Senha")) {
                    exibirCampoSenha(true);
                }
                msgErro.innerText = result.message || "Usuário ou senha inválidos.";
                msgErro.style.display = "block";
            }
        } catch (error) {
            msgErro.innerText = "Erro ao conectar com o servidor.";
            msgErro.style.display = "block";
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = "Entrar";
        }
    });

    function exibirCampoSenha(exibir) {
        if (exibir) {
            campoSenha.style.display = "block";
            inputSenha.setAttribute("required", "required");
        } else {
            campoSenha.style.display = "none";
            inputSenha.removeAttribute("required");
            inputSenha.value = "";
        }
    }

    function efetuarRedirecionamento(user) {
        sessionStorage.setItem("usuarioLogado", JSON.stringify(user));
        const perfil = String(user.perfil).toUpperCase().trim();

        if (perfil === "VISTORIADOR") {
            window.location.href = "cadastro.html";
        } else if (perfil === "ADMINISTRADOR") {
            window.location.href = "admin.html";
        } else if (perfil === "MASTER") {
            window.location.href = "master.html";
        } else {
            msgErro.innerText = "Perfil de acesso não reconhecido.";
            msgErro.style.display = "block";
        }
    }
</script>
