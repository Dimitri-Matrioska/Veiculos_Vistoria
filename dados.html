<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrioska - Painel de dados</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --marinho: #10192E;
            --marinho-hover: #1B2A4A;
            --royal: #3D4FE8;
            --off-white: #F5F1EB;
            --salmao: #F0C089;
            --branco: #FFFFFF;
            --cinza-borda: rgba(16, 25, 46, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
        }

        body {
            background-color: var(--branco);
            color: var(--marinho);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER E LOGOS */
        header {
            position: sticky;
            top: 0;
            z-index: 20;
            height: 60px;

            background-color: var(--off-white);
            padding: 14px 18px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--cinza-borda);
        }

        .logo-box {
            display: flex;
            align-items: center;
            max-width: 42%;
             padding: 14px 18px;
        }

        .logo-box img {
            height: 30px;
            max-width: 100%;
            width: auto;
            object-fit: contain;
             padding: 14px 18px;
        }

        .voltar-menu {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            font-size: 12.5px;
            font-weight: 600;
            color: var(--marinho);
            opacity: 0.55;
            text-decoration: none;

            margin-bottom: 14px;

            transition: opacity 0.2s ease;
        }

        .voltar-menu:hover {
            opacity: 0.9;
        }

        .voltar-menu svg {
            width: 14px;
            height: 14px;
        }

        .topo-pagina {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;

            margin-bottom: 22px;
        }

        .acento {
            width: 36px;
            height: 4px;

            background: var(--salmao);
            border-radius: 4px;

            margin-top: 8px;
        }

        .btn-sair {
            flex-shrink: 0;

            display: inline-flex;
            align-items: center;
            gap: 6px;

            background: var(--branco, #FFFFFF);
            color: var(--marinho);
            border: 1.5px solid var(--cinza-borda);
            border-radius: 10px;

            padding: 9px 14px;

            font-family: inherit;
            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .btn-sair:hover {
            background: var(--off-white);
            border-color: rgba(16, 25, 46, 0.22);
        }

        .btn-sair svg {
            width: 15px;
            height: 15px;
        }

        /* CONTEÚDO PRINCIPAL */
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
        }

        .titulo-pagina {
            font-size: 22px;
            font-weight: 800;
            color: var(--marinho);
        }

        /* PAINEL DE FILTROS */
        .filtros-container {
            background-color: #FFFFFF;
            padding: 18px;
            border-radius: 18px;
            border: 1px solid var(--cinza-borda);
            box-shadow:
                0 10px 28px rgba(16, 25, 46, 0.07),
                0 2px 8px rgba(16, 25, 46, 0.05);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .grupo-filtro {
            display: flex;
            flex-direction: column;
            gap: 7px;
            flex: 1;
            min-width: 200px;
        }

        .grupo-filtro label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--marinho);
            opacity: 0.65;
        }

        .grupo-filtro input, .grupo-filtro select {
            padding: 12px;
            min-height: 46px;
            border: 1.5px solid var(--cinza-borda);
            border-radius: 10px;
            background-color: var(--off-white);
            color: var(--marinho);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .grupo-filtro input:focus, .grupo-filtro select:focus {
            border-color: var(--royal);
            box-shadow: 0 0 0 3px rgba(61, 79, 232, 0.14);
        }

        /* TABELA DE REGISTROS */
        .tabela-container {
            background-color: #FFFFFF;
            border-radius: 18px;
            border: 1px solid var(--cinza-borda);
            box-shadow:
                0 10px 28px rgba(16, 25, 46, 0.07),
                0 2px 8px rgba(16, 25, 46, 0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13.5px;
        }

        th {
            background-color: transparent;
            color: var(--marinho);
            opacity: 0.55;
            padding: 14px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 1px solid var(--cinza-borda);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--cinza-borda);
            color: var(--marinho);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .badge-sim {
            background-color: rgba(240, 192, 137, 0.28);
            color: #8A5A22;
        }

        .badge-nao {
            background-color: rgba(16, 25, 46, 0.06);
            color: rgba(16, 25, 46, 0.5);
        }

        .btn-ver {
            background-color: var(--royal);
            color: #FFFFFF;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 700;
            transition: background 0.2s ease;
        }

        .btn-ver:hover {
            filter: brightness(1.08);
        }

        /* MODAL / POPUP DE DETALHES */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(1, 30, 56, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background-color: #FFFFFF;
            border-radius: 18px;
            max-width: 1500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 26px;
            position: relative;
            box-shadow: 0 20px 50px rgba(16, 25, 46, 0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--cinza-borda);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 19px;
            font-weight: 700;
            color: var(--marinho);
        }

        .fechar-modal {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 32px;
            height: 32px;

            border-radius: 50%;

            color: var(--marinho);
            cursor: pointer;
            background: var(--off-white);
            border: none;

            transition: background 0.2s ease;
        }

        .fechar-modal:hover {
            background: var(--cinza-borda);
        }

        .fechar-modal svg {
            width: 16px;
            height: 16px;
        }

      /* DIAGRAMA DO CARRO - PAISAGEM COM ESPAÇAMENTOS AJUSTADOS */
.diagrama-carro-container {
    display: grid;
    /* Colunas 1 e 3 menores (150px) aproximam Traseira e Dianteira do carro central */
    grid-template-columns: 280px 1fr 280px;
    /* Linhas 1 e 3 com mais altura afastam as laterais (superior/inferior) do carro */
    grid-template-rows: 140px 220px 140px;
    gap: 10px;
    align-items: center;
    justify-items: center;
    margin: 15px 0;
    width: 100%;
}

/* CARRO CENTRAL */
.carro-imagem-central {
    grid-column: 2;
    grid-row: 2;
    width: 100%;
    max-width: 300px;
    height: auto;
    object-fit: contain;
    transform: rotate(90deg);
}

/* MINIATURAS */
.thumb-box {
    width: 100%;
    max-width: 150px;
    border: 1px solid var(--cinza-borda);
    border-radius: 10px;
    padding: 6px;
    text-align: center;
    background-color: var(--off-white);
}

/* AFASTAMENTO VERTICAL DAS LATERAIS */
.thumb-box.topo {
    grid-column: 2;
    grid-row: 1;
    align-self: start; /* Empurra a Lateral Esquerda para o topo */
}


.thumb-box.baixo {
    grid-column: 2;
    grid-row: 3;
    align-self: end; /* Empurra a Lateral Direita para a base */
}

/* ITEM DA COLUNA 1 / LINHA 2 (Traseira) */
.thumb-box.traseira {
    grid-column: 1;
    grid-row: 2;
    justify-self: end; /* Centraliza APENAS este item na coluna 1 */
}

/* ITEM DA COLUNA 3 / LINHA 2 (Dianteira) */
.thumb-box.dianteira {
    grid-column: 3;
    grid-row: 2;
    justify-self: start; /* Centraliza APENAS este item na coluna 3 */
}


.thumb-box span {
    display: block;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 4px;
    text-transform: uppercase;
}

.thumb-box img {
    width: 100%;
    height: 75px;
    object-fit: cover;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.2s;
}

.thumb-box img:hover {
    transform: scale(1.04);
}

        /* FRAME DE ALERTA DE AVARIAS */
        .alerta-avaria-box {
            background-color: rgba(240, 192, 137, 0.16);
            border: 1.5px solid var(--salmao);
            border-radius: 14px;
            padding: 16px;
            margin-top: 20px;
        }

        .alerta-titulo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--marinho);
            margin-bottom: 8px;
        }

        .alerta-titulo svg {
            width: 17px;
            height: 17px;
            color: #8A5A22;
            flex-shrink: 0;
        }

        .alerta-descricao {
            font-size: 13px;
            color: var(--marinho);
            opacity: 0.75;
            margin-bottom: 12px;
        }

        .grid-avarias-fotos {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .grid-avarias-fotos img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            border: 1.5px solid var(--salmao);
        }

        /* LIGHTBOX DE ZOOM COMPLETO */
        .zoom-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .zoom-overlay img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(114, 106, 106, 0.2);
        }

        /* RODAPÉ PADRÃO */
        footer {
            background-color: #FFFFFF;
            border-top: 1px solid var(--cinza-borda);
            padding: 15px 0;
            margin-top: auto;
        }

        .desenvolvedor {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-style: italic;
            color: var(--marinho);
            opacity: 0.5;
        }

        .desenvolvedor img {
            height: 18px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <img src="Imagens_Logos/logo_GB2.png" alt="GB2 Logo">
        </div>
        <div class="logo-box">
            <img src="Imagens_Logos/logo_AFRY.png" alt="AFRY Logo">
        </div>
    </header>

    <main>

        <a class="voltar-menu" href="home.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
            Menu
        </a>

        <div class="topo-pagina">

            <div>
                <h1 class="titulo-pagina">Vistorias Realizadas</h1>
                <div class="acento"></div>
            </div>

            <button class="btn-sair" type="button" onclick="logout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Sair
            </button>

        </div>

        <!-- FILTROS -->
        <div class="filtros-container">
            <div class="grupo-filtro">
                <label for="buscaPlaca">Buscar por Placa</label>
                <input type="text" id="buscaPlaca" placeholder="Digite a placa..." onkeyup="aplicarFiltros()">
            </div>
            
            <div class="grupo-filtro">
                <label for="filtroAvaria">Filtro de Avarias</label>
                <select id="filtroAvaria" onchange="aplicarFiltros()">
                    <option value="TODOS">Todos os Registros</option>
                    <option value="SIM">Com Avaria</option>
                    <option value="NAO">Sem Avaria</option>
                </select>
            </div>
        </div>


        <!-- TABELA -->
        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Placa</th>
                        <th>Motorista</th>
                        <th>Modelo/Cor</th>
                        <th>Avaria?</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo">
                    <!-- Preenchido via script -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- MODAL DE DETALHES -->
    <div class="modal-overlay" id="modalDetalhes">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="modalMotorista">Motorista: -</h2>
                    <span id="modalPlaca" style="font-weight: 700; color: var(--royal);">Placa: -</span>
                </div>
                <button class="fechar-modal" onclick="fecharModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

<div class="diagrama-carro-container">
    
    <!-- LATERAL ESQUERDA (Topo - Afastada para cima) -->
    <div class="thumb-box topo">
        <span>Lat. Esquerda</span>
        <img id="imgLatEsq" src="" onclick="abrirZoom(this.src)">
    </div>

    <!-- TRASEIRA (Esquerda - Próxima ao porta-malas) -->
        <div class="thumb-box traseira">
            <span>Traseira</span>
            <img id="imgTraseira" src="" onclick="abrirZoom(this.src)">
        </div>

    <!-- CARRO CENTRAL -->
    <img src="CARRO.png" alt="Desenho do Veículo" class="carro-imagem-central" onerror="this.src='Imagens_Logos/CARRO.png'">

    <div class="thumb-box dianteira">
        <span>Dianteira</span>
        <img id="imgDianteira" src="" onclick="abrirZoom(this.src)">
    </div>

    <!-- LATERAL DIREITA (Baixo - Afastada para baixo) -->
    <div class="thumb-box baixo">
        <span>Lat. Direita</span>
        <img id="imgLatDir" src="" onclick="abrirZoom(this.src)">
    </div>

</div>

<!-- FRAME DE AVARIAS -->
<div class="alerta-avaria-box" id="boxAvarias" style="display: none;">
    <div class="alerta-titulo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>Avarias Identificadas</span>
    </div>
    <p class="alerta-descricao" id="descAvarias">Nenhuma descrição fornecida.</p>
    <div class="grid-avarias-fotos" id="fotosAvariasContainer">
        <!-- Fotos das avarias inseridas dinamicamente -->
    </div>
</div>

    <!-- ZOOM DA IMAGEM -->
    <div class="zoom-overlay" id="zoomOverlay" onclick="fecharZoom()">
        <img id="imgZoomCompleto" src="">
    </div>

  

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzjyYCR__0C0RLLkiTEwQ0SV_HbNJo2bWA40ATiwTutGWeEcFmSkfgf1WkOsFA6BYin5g/exec";
        let dadosVistorias = [];

        // TRAVA DE SEGURANÇA E ACESSO
        (function validarAcesso() {
            const usuarioLogado = JSON.parse(sessionStorage.getItem("usuarioLogado"));
            if (!usuarioLogado || (usuarioLogado.perfil !== "ADMINISTRADOR" && usuarioLogado.perfil !== "MASTER")) {
                alert("Acesso restrito a administradores.");
                window.location.href = "index.html";
            }
        })();

        window.addEventListener("load", buscarVistorias);

        // Converte o link padrão do Google Drive para o link direto
        function converterUrlDrive(url) {
            if (!url) return '';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        }

        async function buscarVistorias() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.status === "success" && result.data) {
                    dadosVistorias = result.data.slice(1);
                    renderizarTabela(dadosVistorias);
                }
            } catch (err) {
                console.error("Erro ao carregar vistorias:", err);
            }
        }

        function renderizarTabela(lista) {
            const tbody = document.getElementById("tabelaCorpo");
            tbody.innerHTML = "";

            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Nenhum registro encontrado.</td></tr>`;
                return;
            }

            lista.forEach((item) => {
                const dataHora = item[0] ? new Date(item[0]).toLocaleString('pt-BR') : "-";
                const motorista = item[2] || "-";
                const placa = item[4] || "-";
                const modeloCor = `${item[5] || ""} / ${item[6] || ""}`;
                const possuiAvaria = String(item[11]).toUpperCase().trim() === "SIM";

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${dataHora}</td>
                    <td><strong>${placa}</strong></td>
                    <td>${motorista}</td>
                    <td>${modeloCor}</td>
                    <td>
                        <span class="badge ${possuiAvaria ? 'badge-sim' : 'badge-nao'}">
                            ${possuiAvaria ? 'Com Avaria' : 'Sem Avaria'}
                        </span>
                    </td>
                    <td>
                        <button class="btn-ver" onclick="abrirDetalhes('${placa}')">Visualizar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function aplicarFiltros() {
            const textoPlaca = document.getElementById("buscaPlaca").value.toUpperCase().trim();
            const opcaoAvaria = document.getElementById("filtroAvaria").value;

            const filtrados = dadosVistorias.filter(item => {
                const placaItem = String(item[4] || "").toUpperCase();
                const temAvariaItem = String(item[11] || "").toUpperCase().trim();

                const batePlaca = placaItem.includes(textoPlaca);
                let bateAvaria = true;
                if (opcaoAvaria === "SIM") bateAvaria = (temAvariaItem === "SIM");
                if (opcaoAvaria === "NAO") bateAvaria = (temAvariaItem !== "SIM");

                return batePlaca && bateAvaria;
            });

            renderizarTabela(filtrados);
        }

        function abrirDetalhes(placa) {
            const item = dadosVistorias.find(v => String(v[4]).toUpperCase() === placa.toUpperCase());
            if (!item) return;

            document.getElementById("modalMotorista").innerText = `Motorista: ${item[2] || "Não informado"}`;
            document.getElementById("modalPlaca").innerText = `Placa: ${item[4] || "-"}`;

            // Passa os links das fotos de cada ângulo pelo conversor do Drive
            const placeholder = "https://via.placeholder.com/150?text=Sem+Foto";
            document.getElementById("imgDianteira").src = converterUrlDrive(item[7]) || placeholder;
            document.getElementById("imgTraseira").src  = converterUrlDrive(item[8]) || placeholder;
            document.getElementById("imgLatEsq").src    = converterUrlDrive(item[9]) || placeholder;
            document.getElementById("imgLatDir").src    = converterUrlDrive(item[10]) || placeholder;

            const possuiAvaria = String(item[11]).toUpperCase().trim() === "SIM";
            const boxAvarias = document.getElementById("boxAvarias");

            if (possuiAvaria) {
                boxAvarias.style.display = "block";
                document.getElementById("descAvarias").innerText = item[12] || "Sem descrição detalhada.";

                const containerFotos = document.getElementById("fotosAvariasContainer");
                containerFotos.innerHTML = "";

                // Percorre as colunas de fotos de avarias (índices 13 a 17)
                for (let i = 13; i <= 17; i++) {
                    if (item[i] && String(item[i]).startsWith("http")) {
                        const urlTratada = converterUrlDrive(item[i]);
                        const img = document.createElement("img");
                        img.src = urlTratada;
                        img.onclick = () => abrirZoom(urlTratada);
                        containerFotos.appendChild(img);
                    }
                }
            } else {
                boxAvarias.style.display = "none";
            }

            document.getElementById("modalDetalhes").style.display = "flex";
        }

        function fecharModal() {
            document.getElementById("modalDetalhes").style.display = "none";
        }

        function abrirZoom(src) {
            if (!src || src.includes("placeholder")) return;
            document.getElementById("imgZoomCompleto").src = src;
            document.getElementById("zoomOverlay").style.display = "flex";
        }

        function fecharZoom() {
            document.getElementById("zoomOverlay").style.display = "none";
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
