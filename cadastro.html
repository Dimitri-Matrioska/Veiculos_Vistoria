<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Cadastro de Vistoria</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --marinho: #10192E;
            --marinho-hover: #1B2A4A;
            --royal: #3D4FE8;
            --off-white: #F5F1EB;
            --salmao: #F0C089;
            --cinza-borda: rgba(16, 25, 46, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background-color: var(--off-white);
            color: var(--marinho);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        header {
            position: sticky;
            top: 0;
            z-index: 20;

            background-color: #FFFFFF;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--cinza-borda);
            min-height: 58px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            max-width: 42%;
        }

        .logo-box img {
            height: 28px;
            max-width: 100%;
            width: auto;
            object-fit: contain;
        }

        .voltar-menu {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            font-size: 12.5px;
            font-weight: 600;
            color: var(--marinho);
            opacity: 0.55;
            text-decoration: none;

            margin-bottom: 14px;

            transition: opacity 0.2s ease;
        }

        .voltar-menu:hover {
            opacity: 0.9;
        }

        .voltar-menu svg {
            width: 14px;
            height: 14px;
        }

        /* =====================================================
           CONTEÚDO
        ===================================================== */

        main {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 14px 12px 20px;
        }

        .card-form {
            background-color: #FFFFFF;
            border-radius: 18px;
            border: 1px solid var(--cinza-borda);
            padding: 22px 18px;
            box-shadow:
                0 10px 28px rgba(16, 25, 46, 0.07),
                0 2px 8px rgba(16, 25, 46, 0.05);
        }

        .titulo-pagina {
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--marinho);
        }

        .acento {
            width: 36px;
            height: 4px;

            background: var(--salmao);
            border-radius: 4px;

            margin-bottom: 12px;
        }

        .subtitulo {
            display: inline-flex;
            align-items: center;

            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            line-height: 1.4;

            color: var(--marinho);
            opacity: 0.55;

            margin-bottom: 20px;
        }

        /* =====================================================
           INDICADOR DE PASSOS
        ===================================================== */

        .passos-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            border-bottom: 2px solid var(--off-white);
            padding-bottom: 5px;
            gap: 5px;
        }

        .passo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 10px;
            font-weight: 600;
            color: #999;
            text-align: center;
            flex: 1;
        }

        .passo-item.ativo {
            color: var(--royal);
        }

        .passo-numero {
            width: 27px;
            height: 27px;
            border-radius: 50%;
            background-color: var(--cinza-borda);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .passo-item.ativo .passo-numero {
            background-color: var(--royal);
        }

        /* =====================================================
           PASSOS
        ===================================================== */

        .passo-conteudo {
            display: none;
        }

        .passo-conteudo.ativo {
            display: block;
        }

        .secao-titulo {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--marinho);
            margin-bottom: 10px;
        }

        /* =====================================================
           FORMULÁRIO
        ===================================================== */

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .grupo-input {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .grupo-input label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--marinho);
            opacity: 0.65;
        }

        .grupo-input input,
        .grupo-input select,
        .grupo-input textarea {
            width: 100%;
            padding: 13px 12px;
            min-height: 46px;
            border: 1.5px solid var(--cinza-borda);
            border-radius: 10px;
            background-color: var(--off-white);
            color: var(--marinho);
            font-size: 15px;
            outline: none;
            -webkit-appearance: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .grupo-input textarea {
            resize: vertical;
            min-height: 90px;
        }

        .grupo-input input:focus,
        .grupo-input select:focus,
        .grupo-input textarea:focus {
            border-color: var(--royal);
            box-shadow: 0 0 0 3px rgba(61, 79, 232, 0.14);
        }

        /* =====================================================
           ÁREA DAS FOTOS — LAYOUT EM CRUZ
           dianteira em cima / traseira embaixo / laterais nos lados
           carro grande e centralizado
        ===================================================== */

        .diagrama-carro-container {
            display: grid;
            grid-template-columns: 72px 1fr 72px;
            grid-template-rows: auto auto auto;
            gap: 12px;
            align-items: center;
            justify-items: stretch;
            margin: 22px 0;
        }

        .carro-imagem-central {
            grid-column: 2;
            grid-row: 2;
            width: 100%;
            max-width: 260px;
            max-height: 190px;
            object-fit: contain;
            justify-self: center;
        }

        .foto-slot {
            min-height: 78px;
            border: 2px dashed var(--cinza-borda);
            border-radius: 12px;
            padding: 4px;
            text-align: center;
            background-color: var(--off-white);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .foto-slot.tem-foto {
            border-style: solid;
            border-color: var(--royal);
        }

        .foto-slot:active {
            border-color: var(--royal);
            background-color: #FFFFFF;
            transform: scale(0.98);
        }

        .foto-slot input[type="file"] {
            display: none;
        }

        .foto-slot label {
            width: 100%;
            height: 100%;
            cursor: pointer;
            font-size: 9px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            line-height: 1.15;
        }

        .icone-camera {
            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--marinho);
            opacity: 0.35;
        }

        .icone-camera svg {
            width: 17px;
            height: 17px;
        }

        .texto-camera {
            color: var(--marinho);
            opacity: 0.55;
        }

        /* Quando já existe foto: ícone some, mostra miniatura pequena */
        .foto-slot.tem-foto .icone-camera {
            display: none;
        }

        .preview-img {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 5px;
            display: none;
            border: 1px solid var(--cinza-borda);
        }

        /* Posições no grid (mesmas no mobile e desktop) */
        .foto-dianteira {
            grid-column: 2;
            grid-row: 1;
        }

        .foto-traseira {
            grid-column: 2;
            grid-row: 3;
        }

        .foto-lateral-esquerda {
            grid-column: 1;
            grid-row: 2;
        }

        .foto-lateral-direita {
            grid-column: 3;
            grid-row: 2;
        }

        /* =====================================================
           FOTOS DE AVARIAS
        ===================================================== */

        .fotos-avarias {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .foto-avaria {
            min-height: 70px;
            padding: 5px;
        }

        .foto-avaria label {
            font-size: 10px;
        }

        /* =====================================================
           BOTÕES
        ===================================================== */

        .botoes-passo {
            display: flex;
            justify-content: space-between;
            margin-top: 28px;
            gap: 10px;
        }

        .btn-nav {
            min-height: 50px;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition:
                opacity 0.2s ease,
                background 0.2s ease,
                transform 0.15s ease;
            touch-action: manipulation;
        }

        .btn-proximo {
            background-color: var(--royal);
            color: #FFFFFF;
            margin-left: auto;
        }

        .btn-anterior {
            background-color: var(--off-white);
            color: var(--marinho);
            border: 1.5px solid var(--cinza-borda);
        }

        .btn-salvar {
            background-color: var(--marinho);
            color: #FFFFFF;
            margin-left: auto;
        }

        .btn-nav:hover {
            filter: brightness(1.08);
        }

        .btn-anterior:hover {
            filter: none;
            background-color: #FFFFFF;
        }

        .btn-nav:active {
            transform: scale(0.98);
        }

        .btn-nav:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        /* =====================================================
           MODAL DE UPLOAD (barra de progresso + gif)
        ===================================================== */

        .modal-upload-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(1, 30, 56, 0.72);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-upload-overlay.ativo {
            display: flex;
        }

        .modal-upload-box {
            background-color: #FFFFFF;
            border-radius: 12px;
            padding: 26px 22px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .modal-upload-gif {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto 14px;
            display: block;
        }

        .modal-upload-titulo {
            font-size: 15px;
            font-weight: 700;
            color: var(--marinho);
            margin-bottom: 4px;
        }

        .modal-upload-status {
            font-size: 12px;
            color: #666;
            margin-bottom: 16px;
        }

        .barra-progresso-container {
            width: 100%;
            height: 12px;
            background-color: var(--off-white);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--cinza-borda);
        }

        .barra-progresso-fill {
            height: 100%;
            width: 0%;
            background-color: var(--royal);
            border-radius: 6px;
            transition: width 0.2s ease;
        }

        .barra-progresso-texto {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--royal);
        }

        /* =====================================================
           RODAPÉ
        ===================================================== */

        footer {
            background-color: #FFFFFF;
            border-top: 1px solid var(--cinza-borda);
            padding: 10px 0;
            margin-top: auto;
        }

        .desenvolvedor {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            font-size: 10px;
            font-style: italic;
            color: var(--marinho);
            opacity: 0.5;
        }

        .desenvolvedor img {
            height: 18px;
            max-width: 120px;
            object-fit: contain;
            opacity: 0.9;
        }

        /* =====================================================
           TABLETS / DESKTOP
        ===================================================== */

        @media (min-width: 651px) {

            header {
                padding: 12px 30px;
            }

            .logo-box img {
                height: 38px;
            }

            main {
                margin: 25px auto;
                padding: 0 20px;
            }

            .card-form {
                padding: 36px;
            }

            .grid-inputs {
                grid-template-columns: repeat(2, 1fr);
            }

            .diagrama-carro-container {
                grid-template-columns: 120px 1fr 120px;
                gap: 22px;
            }

            .carro-imagem-central {
                max-width: 340px;
                max-height: 240px;
            }

            .foto-slot {
                min-height: 95px;
            }

            .foto-slot label {
                font-size: 11px;
            }

            .icone-camera svg {
                width: 20px;
                height: 20px;
            }

            .preview-img {
                width: 38px;
                height: 38px;
            }

            .passo-item {
                flex-direction: row;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header>

        <div class="logo-box">
            <img src="Imagens_Logos/logo_GB2.png" alt="GB2 Logo">
        </div>

        <div class="logo-box">
            <img src="Imagens_Logos/logo_AFRY.png" alt="AFRY Logo">
        </div>

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ===================================================== -->

    <main>

        <a class="voltar-menu" href="home.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
            Menu
        </a>

        <div class="card-form">

            <!-- INDICADOR DE PASSOS -->

            <div class="passos-container">

                <div class="passo-item ativo" id="indicador-1">
                    <div class="passo-numero">1</div>
                    <span>Dados</span>
                </div>

                <div class="passo-item" id="indicador-2">
                    <div class="passo-numero">2</div>
                    <span>Fotos</span>
                </div>

                <div class="passo-item" id="indicador-3">
                    <div class="passo-numero">3</div>
                    <span>Avarias</span>
                </div>

            </div>


            <form id="formVistoria">


                <!-- =====================================================
                     PASSO 1
                ===================================================== -->

                <div class="passo-conteudo ativo" id="passo-1">

                    


                    <div class="grid-inputs">

                        <div class="grupo-input">

                            <label for="motorista">
                                Nome do Motorista
                            </label>

                            <input
                                type="text"
                                id="motorista"
                                required
                                placeholder="Digite o nome completo">

                        </div>


                        <div class="grupo-input">

                            <label for="cpf">
                                CPF do Motorista
                            </label>

                            <input
                                type="text"
                                id="cpf"
                                maxlength="11"
                                inputmode="numeric"
                                required
                                placeholder="Apenas números"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')">

                        </div>


                        <div class="grupo-input">

                            <label for="placa">
                                Placa do Veículo
                            </label>

                            <input
                                type="text"
                                id="placa"
                                maxlength="7"
                                required
                                placeholder="Ex: ABC1D23"
                                style="text-transform: uppercase;"
                                oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '')">

                        </div>


                        <div class="grupo-input">

                            <label for="modelo">
                                Modelo
                            </label>

                            <input
                                type="text"
                                id="modelo"
                                required
                                placeholder="Ex: Gol 1.0">

                        </div>


                        <div class="grupo-input">

                            <label for="cor">
                                Cor
                            </label>

                            <input
                                type="text"
                                id="cor"
                                required
                                placeholder="Ex: Branco">

                        </div>

                    </div>


                    <div class="botoes-passo">

                        <button
                            type="button"
                            class="btn-nav btn-proximo"
                            onclick="avancarPasso(2)">

                            Avançar para Fotos ➔

                        </button>

                    </div>

                </div>


                <!-- =====================================================
                     PASSO 2 - FOTOS
                ===================================================== -->

                <div class="passo-conteudo" id="passo-2">

                    <div class="secao-titulo">
                        Fotografe os 4 Ângulos
                    </div>


                    <div class="diagrama-carro-container">


                        <!-- CARRO CENTRAL -->

                        <img
                            src="Imagens_Logos/CARRO.png"
                            alt="Veículo"
                            class="carro-imagem-central">


                        <!-- DIANTEIRA -->

                        <div class="foto-slot foto-dianteira" id="slot-dianteira">

                            <label for="fotoDianteira">

                                <span class="icone-camera">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                        <circle cx="12" cy="13" r="4"></circle>
                                    </svg>
                                </span>

                                <img
                                    id="prev-dianteira"
                                    class="preview-img"
                                    alt="Foto dianteira">

                                <span class="texto-camera">
                                    Dianteira
                                </span>

                            </label>

                            <input
                                type="file"
                                id="fotoDianteira"
                                accept="image/*"
                                capture="environment"
                                onchange="previewImagem(this, 'prev-dianteira', 'slot-dianteira')">

                        </div>


                        <!-- LATERAL ESQUERDA -->

                        <div class="foto-slot foto-lateral-esquerda" id="slot-latesq">

                            <label for="fotoLatEsq">

                                <span class="icone-camera">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                        <circle cx="12" cy="13" r="4"></circle>
                                    </svg>
                                </span>

                                <img
                                    id="prev-latesq"
                                    class="preview-img"
                                    alt="Foto lateral esquerda">

                                <span class="texto-camera">
                                    Esquerda
                                </span>

                            </label>

                            <input
                                type="file"
                                id="fotoLatEsq"
                                accept="image/*"
                                capture="environment"
                                onchange="previewImagem(this, 'prev-latesq', 'slot-latesq')">

                        </div>


                        <!-- TRASEIRA -->

                        <div class="foto-slot foto-traseira" id="slot-traseira">

                            <label for="fotoTraseira">

                                <span class="icone-camera">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                        <circle cx="12" cy="13" r="4"></circle>
                                    </svg>
                                </span>

                                <img
                                    id="prev-traseira"
                                    class="preview-img"
                                    alt="Foto traseira">

                                <span class="texto-camera">
                                    Traseira
                                </span>

                            </label>

                            <input
                                type="file"
                                id="fotoTraseira"
                                accept="image/*"
                                capture="environment"
                                onchange="previewImagem(this, 'prev-traseira', 'slot-traseira')">

                        </div>


                        <!-- LATERAL DIREITA -->

                        <div class="foto-slot foto-lateral-direita" id="slot-latdir">

                            <label for="fotoLatDir">

                                <span class="icone-camera">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                        <circle cx="12" cy="13" r="4"></circle>
                                    </svg>
                                </span>

                                <img
                                    id="prev-latdir"
                                    class="preview-img"
                                    alt="Foto lateral direita">

                                <span class="texto-camera">
                                    Direita
                                </span>

                            </label>

                            <input
                                type="file"
                                id="fotoLatDir"
                                accept="image/*"
                                capture="environment"
                                onchange="previewImagem(this, 'prev-latdir', 'slot-latdir')">

                        </div>

                    </div>


                    <div class="botoes-passo">

                        <button
                            type="button"
                            class="btn-nav btn-anterior"
                            onclick="avancarPasso(1)">

                            ⬅ Voltar

                        </button>


                        <button
                            type="button"
                            class="btn-nav btn-proximo"
                            onclick="avancarPasso(3)">

                            Avançar ➔

                        </button>

                    </div>

                </div>


                <!-- =====================================================
                     PASSO 3
                ===================================================== -->

                <div class="passo-conteudo" id="passo-3">

                    <div class="secao-titulo">
                        Registro de Avarias
                    </div>


                    <div
                        class="grupo-input"
                        style="margin-bottom: 20px;">

                        <label for="possuiAvarias">
                            O veículo possui avarias?
                        </label>

                        <select
                            id="possuiAvarias"
                            onchange="toggleSecaoAvarias(this.value)">

                            <option value="Não">
                                Não, veículo sem avarias
                            </option>

                            <option value="Sim">
                                Sim, possui avarias
                            </option>

                        </select>

                    </div>


                    <div
                        id="secao-detalhes-avarias"
                        style="display: none;">


                        <div

                                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                        <circle cx="12" cy="13" r="4"></circle>

                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                        <circle cx="12" cy="13" r="4"></circle>
                                    </svg>
                                    </span>

                                    <img
                                        id="prev-avaria2"

                                    <span>
                                        Avaria 2

                                </label>

                                <input
                                    type="file"

                            <!-- AVARIA 3 -->

                            <div class="foto-slot foto-avaria" id="slot-avaria3">

                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                        <circle cx="12" cy="13" r="4"></circle>
                                    </svg>
                                    </span>

                                    <img
                                        id="prev-avaria3"
                                        class="preview-img"
                                        alt="Foto avaria 3">

                                    <span>
                                        Avaria 3
                                    </span>

                                </label>

                                <input
                                    type="file"
                                    id="fotoAvaria3"

                    </div>


                    <div class="botoes-passo">

                        <button
                            type="button"
                            class="btn-nav btn-anterior"
                            onclick="avancarPasso(2)">

                            ⬅ Voltar

                        </button>


                        <button
                            type="submit"

        </div>

    </main>


    <!-- =====================================================
         RODAPÉ
    ===================================================== -->

    <footer>

        <div class="desenvolvedor">

            <span>
                Desenvolvido por
            </span>

            <img
                src="Imagens_Logos/logo_MATRIOSKA.png"
                alt="MATRIOSKA Desenvolvimento e Soluções em Planejamento">

        </div>

    </footer>


    <!-- =====================================================
         MODAL DE UPLOAD
    ===================================================== -->

    <div class="modal-upload-overlay" id="modalUpload">

        <div class="modal-upload-box">

            <img
                src="Imagens_Logos/Logo_animada2.gif"
                alt="Enviando..."
                class="modal-upload-gif">

            <div class="modal-upload-titulo">
                Enviando Vistoria
            </div>

            <div class="modal-upload-status" id="modalUploadStatus">
                Otimizando fotos...
            </div>

            <div class="barra-progresso-container">
                <div class="barra-progresso-fill" id="barraProgressoFill"></div>
            </div>

            <div class="barra-progresso-texto" id="barraProgressoTexto">
                0%
            </div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        const API_URL =
            "https://script.google.com/macros/s/AKfycbzjyYCR__0C0RLLkiTEwQ0SV_HbNJo2bWA40ATiwTutGWeEcFmSkfgf1WkOsFA6BYin5g/exec";


        let usuarioSessao = null;


        /* =====================================================
           VALIDAÇÃO DA SESSÃO
        ===================================================== */

        (function validarAcesso() {

            usuarioSessao =
                JSON.parse(sessionStorage.getItem("usuarioLogado"));

            if (!usuarioSessao) {

                alert("Sessão expirada. Faça login novamente.");

                window.location.href = "index.html";

            }

        })();


        /* =====================================================
           CONTROLE DOS PASSOS
        ===================================================== */

        function avancarPasso(passo) {

            document
                .querySelectorAll(".passo-conteudo")
                .forEach(el => {

                    el.classList.remove("ativo");

                });


            document
                .querySelectorAll(".passo-item")
                .forEach(el => {

                    el.classList.remove("ativo");

                });


            document
                .getElementById(`passo-${passo}`)
                .classList.add("ativo");


            document
                .getElementById(`indicador-${passo}`)
                .classList.add("ativo");


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* =====================================================
           PREVIEW DAS IMAGENS
        ===================================================== */

        function previewImagem(input, idPreview, idSlot) {

            if (input.files && input.files[0]) {

                const reader = new FileReader();

                reader.onload = function(e) {

                    const img =
                        document.getElementById(idPreview);

                    img.src = e.target.result;

                    img.style.display = "block";


                    if (idSlot) {

                        document
                            .getElementById(idSlot)
                            .classList.add("tem-foto");

                    }

                };

                reader.readAsDataURL(input.files[0]);

            }

        }


        /* =====================================================
           AVARIAS
        ===================================================== */

        function toggleSecaoAvarias(valor) {

            const secao =
                document.getElementById("secao-detalhes-avarias");

            secao.style.display =
                valor === "Sim"
                    ? "block"
                    : "none";

        }


        /* =====================================================
           MODAL DE UPLOAD
        ===================================================== */

        function abrirModalUpload() {

            document
                .getElementById("modalUpload")
                .classList.add("ativo");

            atualizarProgresso(0, "Otimizando fotos...");

        }

        function fecharModalUpload() {

            document
                .getElementById("modalUpload")
                .classList.remove("ativo");

        }

        function atualizarProgresso(percentual, texto) {

            document
                .getElementById("barraProgressoFill")
                .style.width = `${percentual}%`;

            document
                .getElementById("barraProgressoTexto")
                .innerText = `${Math.round(percentual)}%`;

            if (texto) {

                document
                    .getElementById("modalUploadStatus")
                    .innerText = texto;

            }

        }

        /* =====================================================
           BARRA DE PROGRESSO ESTIMADA
           (o fetch não expõe progresso real de upload, e o
           XMLHttpRequest tem problemas com o redirect 302 do
           Google Apps Script em requisições cross-origin, então
           estimamos o tempo com base no tamanho do payload)
        ===================================================== */

        let progressoIntervalId = null;

        function iniciarProgressoEstimado(duracaoEstimadaMs) {

            const inicio = Date.now();

            progressoIntervalId = setInterval(function() {

                const decorrido = Date.now() - inicio;

                let percentual =
                    (decorrido / duracaoEstimadaMs) * 92;

                if (percentual > 92) {

                    percentual = 92;

                }

                atualizarProgresso(percentual, "Enviando Vistoria...");

            }, 150);

        }

        function pararProgressoEstimado() {

            if (progressoIntervalId) {

                clearInterval(progressoIntervalId);

                progressoIntervalId = null;

            }

        }

        /* =====================================================
           ENVIAR PAYLOAD (fetch, com progresso estimado)
        ===================================================== */

        async function enviarComProgresso(url, payload) {

            const payloadTexto = JSON.stringify(payload);

            // Estima duração assumindo ~250KB/s de upload (conservador p/ 4G/wifi fraco)
            const tamanhoBytes = payloadTexto.length;

            let duracaoEstimadaMs =
                (tamanhoBytes / (250 * 1024)) * 1000;

            duracaoEstimadaMs =
                Math.min(Math.max(duracaoEstimadaMs, 2500), 60000);


            iniciarProgressoEstimado(duracaoEstimadaMs);


            try {

                const response = await fetch(url, {

                    method: "POST",

                    body: payloadTexto

                });


                const resultado = await response.json();

                pararProgressoEstimado();

                atualizarProgresso(100, "Concluído!");

                return resultado;


            } catch (err) {

                pararProgressoEstimado();

                throw err;

            }

        }


        function comprimirImagem(file, maxLado = 1280, qualidade = 0.7) {

            return new Promise((resolve, reject) => {

                if (!file) {

                    resolve("");

                    return;

                }

                const reader = new FileReader();

                reader.onerror = error =>
                    reject(error);

                reader.onload = function(e) {

                    const img = new Image();

                    img.onerror = error =>
                        reject(error);

                    img.onload = function() {

                        let largura = img.width;
                        let altura = img.height;

                        if (largura > altura && largura > maxLado) {

                            altura =
                                Math.round(altura * (maxLado / largura));

                            largura = maxLado;

                        } else if (altura > maxLado) {

                            largura =
                                Math.round(largura * (maxLado / altura));

                            altura = maxLado;

                        }

                        const canvas =
                            document.createElement("canvas");

                        canvas.width = largura;
                        canvas.height = altura;

                        const ctx =
                            canvas.getContext("2d");

                        ctx.drawImage(img, 0, 0, largura, altura);

                        resolve(
                            canvas.toDataURL("image/jpeg", qualidade)
                        );

                    };

                    img.src = e.target.result;

                };

                reader.readAsDataURL(file);

            });

        }


        /* =====================================================
           ENVIO DO FORMULÁRIO
        ===================================================== */

        document
            .getElementById("formVistoria")
            .addEventListener("submit", async function(e) {

                e.preventDefault();


                const btn =
                    document.getElementById("btnSalvar");


                btn.disabled = true;

                btn.innerText =
                    "Enviando...";

                abrirModalUpload();


                try {

                    // Comprime as fotos em paralelo antes de montar o payload
                    const [
                        fotoDianteira,
                        fotoTraseira,
                        fotoLatEsq,
                        fotoLatDir,
                        fotoAvaria1,
                        fotoAvaria2,
                        fotoAvaria3
                    ] = await Promise.all([

                        comprimirImagem(
                            document.getElementById("fotoDianteira").files[0]
                        ),

                        comprimirImagem(
                            document.getElementById("fotoTraseira").files[0]
                        ),

                        comprimirImagem(
                            document.getElementById("fotoLatEsq").files[0]
                        ),

                        comprimirImagem(
                            document.getElementById("fotoLatDir").files[0]
                        ),

                        comprimirImagem(
                            document.getElementById("fotoAvaria1").files[0]
                        ),

                        comprimirImagem(
                            document.getElementById("fotoAvaria2").files[0]
                        ),

                        comprimirImagem(
                            document.getElementById("fotoAvaria3").files[0]
                        )

                    ]);


                    atualizarProgresso(0, "Enviando Vistoria...");


                    const payload = {

                        usuarioResponsavel:
                            usuarioSessao.nome,

                        motorista:
                            document.getElementById("motorista").value,

                        cpf:
                            document.getElementById("cpf").value,

                        placa:
                            document
                                .getElementById("placa")
                                .value
                                .toUpperCase(),

                        modelo:
                            document.getElementById("modelo").value,

                        cor:
                            document.getElementById("cor").value,


                        fotoDianteira,
                        fotoTraseira,
                        fotoLatEsq,
                        fotoLatDir,


                        possuiAvarias:
                            document
                                .getElementById("possuiAvarias")
                                .value,


                        descricaoAvarias:
                            document
                                .getElementById("descricaoAvarias")
                                .value,


                        fotoAvaria1,
                        fotoAvaria2,
                        fotoAvaria3

                    };


                    const result =
                        await enviarComProgresso(API_URL, payload);


                    if (result.status === "success") {

                        atualizarProgresso(100, "Concluído!");

                        // pequena pausa para o navegador pintar a barra em 100%
                        // antes do alert() travar a tela
                        await new Promise(r => setTimeout(r, 400));

                        alert(
                            "Vistoria salva com sucesso!"
                        );

                        window.location.reload();

                    } else {

                        alert(
                            "Erro ao salvar: " +
                            result.message
                        );

                    }


                } catch (err) {

                    alert(
                        "Erro ao conectar com o servidor: " +
                        (err && err.message ? err.message : err)
                    );

                    console.error(err);


                } finally {

                    fecharModalUpload();

                    btn.disabled = false;

                    btn.innerText =
                        "Finalizar Vistoria";

                }

            });

    </script>

</body>
