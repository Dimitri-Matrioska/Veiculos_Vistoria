<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Usuários</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --marinho: #10192E;
            --marinho-hover: #1B2A4A;
            --royal: #3D4FE8;
            --salmao: #F0C089;
            --off-white: #F5F1EB;
            --branco: #FFFFFF;
            --cinza-borda: rgba(16, 25, 46, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--branco);
            font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
            color: var(--marinho);
            -webkit-font-smoothing: antialiased;
        }

        /* =========================
           CABEÇALHO
           ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--off-white);
            height: 60px;
        

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 14px 18px;

            
            border-bottom: 1px solid var(--cinza-borda);
        }

        .logo-box {
            display: flex;
            align-items: center;
            max-width: 42%;
        }

        .logo-box img {
            height: 30px;
            max-width: 100%;
            width: auto;
            object-fit: contain;
        }

        /* =========================
           CONTEÚDO
           ========================= */

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 18px 16px 40px;
        }

        .voltar-menu {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            font-size: 12.5px;
            font-weight: 600;
            color: var(--marinho);
            opacity: 0.55;
            text-decoration: none;

            margin-bottom: 14px;

            transition: opacity 0.2s ease;
        }

        .voltar-menu:hover {
            opacity: 0.9;
        }

        .voltar-menu svg {
            width: 14px;
            height: 14px;
        }

        .topo-pagina {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;

            margin-bottom: 24px;
        }

        .titulo-pagina {
            font-size: 22px;
            font-weight: 800;
        }

        .acento {
            width: 36px;
            height: 4px;

            background: var(--salmao);
            border-radius: 4px;

            margin-top: 8px;
        }

        .btn-sair {
            flex-shrink: 0;

            display: inline-flex;
            align-items: center;
            gap: 6px;

            background: var(--branco);
            color: var(--marinho);
            border: 1.5px solid var(--cinza-borda);
            border-radius: 10px;

            padding: 9px 14px;

            font-family: inherit;
            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .btn-sair:hover {
            background: var(--off-white);
            border-color: rgba(16, 25, 46, 0.22);
        }

        .btn-sair svg {
            width: 15px;
            height: 15px;
        }

        /* =========================
           CARD
           ========================= */

        .card {
            background: var(--branco);
            border: 1px solid var(--cinza-borda);
            border-radius: 18px;
            padding: 22px 18px;

            box-shadow:
                0 10px 28px rgba(16, 25, 46, 0.07),
                0 2px 8px rgba(16, 25, 46, 0.05);

            margin-bottom: 24px;
        }

        .card-titulo {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;

            margin-bottom: 18px;
        }

        /* =========================
           FORMULÁRIO
           ========================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .campo label {
            display: block;

            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;

            color: var(--marinho);
            opacity: 0.65;

            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;

            min-height: 46px;
            padding: 12px;

            border: 1.5px solid var(--cinza-borda);
            border-radius: 10px;

            background: var(--off-white);
            color: var(--marinho);

            font-family: inherit;
            font-size: 15px;

            outline: none;

            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        select {
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310192e'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 18px;
            padding-right: 38px;
        }

        input:focus,
        select:focus {
            border-color: var(--royal);
            box-shadow: 0 0 0 3px rgba(61, 79, 232, 0.14);
        }

        .campo-senha {
            max-height: 0;
            opacity: 0;
            overflow: hidden;

            transition: max-height 0.35s ease, opacity 0.3s ease;
        }

        .campo-senha.mostrar {
            max-height: 100px;
            opacity: 1;
        }

        .btn-add {
            grid-column: 1 / -1;

            min-height: 50px;

            background: var(--marinho);
            color: var(--branco);
            border: none;
            border-radius: 12px;

            font-family: inherit;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: background 0.2s ease, transform 0.15s ease;
        }

        .btn-add:hover {
            background: var(--marinho-hover);
        }

        .btn-add:active {
            transform: scale(0.99);
        }

        /* =========================
           TABELA
           ========================= */

        .tabela-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 480px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--cinza-borda);
            font-size: 13.5px;
        }

        th {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;

            color: var(--marinho);
            opacity: 0.55;
        }

        td {
            color: var(--marinho);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;

            padding: 4px 10px;
            border-radius: 20px;
        }

        .badge-ativo {
            background: rgba(61, 79, 232, 0.10);
            color: var(--royal);
        }

        .badge-inativo {
            background: rgba(16, 25, 46, 0.06);
            color: rgba(16, 25, 46, 0.45);
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .estado-vazio {
            text-align: center;
            padding: 30px 10px;
            opacity: 0.5;
            font-size: 13px;
        }

        /* =========================
           RODAPÉ
           ========================= */

        footer.rodape {
            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 10px 20px 30px;
        }

        footer.rodape span {
            font-size: 10px;
            font-style: italic;
            letter-spacing: 0.5px;
            text-transform: uppercase;

            opacity: 0.4;

            margin-bottom: 8px;
        }

        footer.rodape img {
            width: 80px;
            height: auto;

            opacity: 0.85;
        }

        @media (min-width: 600px) {

            header,
            main {
                padding-left: 40px;
                padding-right: 40px;
            }

            header img {
                height: 34px;
            }
        }
    </style>
</head>
<body>

    <header>

        <div class="logo-box">
            <img src="Imagens_Logos/logo_GB2.png" alt="GB2 Logo">
        </div>

        <div class="logo-box">
            <img src="Imagens_Logos/logo_AFRY.png" alt="AFRY Logo">
        </div>

    </header>


    <main>

        <a class="voltar-menu" href="home.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
            Menu
        </a>

        <div class="topo-pagina">

            <div>
                <h1 class="titulo-pagina">Gestão de Usuários</h1>
                <div class="acento"></div>
            </div>

            <button class="btn-sair" type="button" onclick="logout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Sair
            </button>

        </div>


        <!-- CADASTRO -->

        <section class="card">

            <div class="card-titulo">Cadastrar novo usuário</div>

            <form id="formNovoUsuario" onsubmit="cadastrarUsuario(event)">
                <div class="form-grid">

                    <div class="campo">
                        <label for="cadCpf">CPF / Usuário</label>
                        <input type="text" id="cadCpf" required placeholder="000.000.000-00">
                    </div>

                    <div class="campo">
                        <label for="cadNome">Nome completo</label>
                        <input type="text" id="cadNome" required placeholder="Nome do usuário">
                    </div>

                    <div class="campo">
                        <label for="cadPerfil">Perfil de acesso</label>
                        <select id="cadPerfil" onchange="toggleSenhaInput()">
                            <option value="VISTORIADOR">Vistoriador (apenas CPF)</option>
                            <option value="ADMINISTRADOR">Administrador (CPF + senha)</option>
                            <option value="MASTER">Master (acesso total)</option>
                        </select>
                    </div>

                    <div class="campo campo-senha" id="box-senha">
                        <label for="cadSenha">Senha de acesso</label>
                        <input type="password" id="cadSenha" placeholder="Digite a senha">
                    </div>

                    <button type="submit" class="btn-add">Salvar usuário</button>

                </div>
            </form>

        </section>


        <!-- LISTAGEM -->

        <section class="card">

            <div class="card-titulo">Usuários cadastrados</div>

            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>CPF</th>
                            <th>Nome</th>
                            <th>Perfil</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="listaUsuarios">
                        <tr><td colspan="4" class="estado-vazio">Carregando usuários...</td></tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>


    <footer class="rodape">
        <span>Desenvolvido por</span>
        <img src="Imagens_Logos/logo_MATRIOSKA.png" alt="MATRIOSKA Desenvolvimento e Soluções em Planejamento">
    </footer>


    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyqvnIpHxNR2njqrkKvyT5qVXyrYncnRrNzPUCJ_3cANn7PO8h93qIPY-gxMAWpK9-vDA/exec";

        // VALIDAÇÃO DE SESSÃO
        const usuario = JSON.parse(sessionStorage.getItem('usuarioLogado'));
        if (!usuario || (usuario.perfil !== "MASTER")) {
            alert("Acesso restrito a administradores Master.");
            window.location.href = "index.html";
        }

        function toggleSenhaInput() {
            const perfil = document.getElementById('cadPerfil').value;
            const box = document.getElementById('box-senha');
            if (perfil !== "VISTORIADOR") {
                box.classList.add('mostrar');
            } else {
                box.classList.remove('mostrar');
                document.getElementById('cadSenha').value = '';
            }
        }

        async function carregarUsuarios() {
            try {
                const res = await fetch(`${API_URL}?action=listarUsuarios`);
                const json = await res.json();
                const tbody = document.getElementById('listaUsuarios');
                tbody.innerHTML = '';

                if (json.status === "success" && json.data.length > 1) {
                    json.data.slice(1).forEach(row => {
                        const status = String(row[4] || '').trim();
                        const ativo = status.toUpperCase() === 'ATIVO';
                        const badgeClasse = ativo ? 'badge-ativo' : 'badge-inativo';

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row[0]}</td>
                            <td>${row[1]}</td>
                            <td>${row[3]}</td>
                            <td><span class="badge-status ${badgeClasse}"><span class="badge-dot"></span>${status || '—'}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="estado-vazio">Nenhum usuário cadastrado ainda.</td></tr>';
                }
            } catch (e) {
                console.error("Erro ao listar usuários:", e);
                document.getElementById('listaUsuarios').innerHTML =
                    '<tr><td colspan="4" class="estado-vazio">Erro ao carregar usuários.</td></tr>';
            }
        }

        async function cadastrarUsuario(e) {
            e.preventDefault();
            const payload = {
                action: "cadastrarUsuario",
                cpf: document.getElementById('cadCpf').value,
                nome: document.getElementById('cadNome').value,
                perfil: document.getElementById('cadPerfil').value,
                senha: document.getElementById('cadSenha').value
            };

            const res = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            const json = await res.json();

            if (json.status === "success") {
                alert("Usuário cadastrado com sucesso!");
                document.getElementById('formNovoUsuario').reset();
                document.getElementById('box-senha').classList.remove('mostrar');
                carregarUsuarios();
            } else {
                alert("Erro: " + json.message);
            }
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = "index.html";
        }

        carregarUsuarios();
    </script>
</body>
</html>
